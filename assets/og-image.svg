<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="RN Safe Upgrade - the React Native upgrade assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1017"/>
      <stop offset="55%" stop-color="#0a0c10"/>
      <stop offset="100%" stop-color="#0b0f16"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#2f5fd8" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#2f5fd8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8def"/>
      <stop offset="100%" stop-color="#2f5fd8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="980" cy="120" rx="520" ry="420" fill="url(#glow)"/>
  <ellipse cx="120" cy="620" rx="420" ry="320" fill="url(#glow)" opacity="0.5"/>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 90H1200M0 180H1200M0 270H1200M0 360H1200M0 450H1200M0 540H1200"/>
    <path d="M100 0V630M200 0V630M300 0V630M400 0V630M500 0V630M600 0V630M700 0V630M800 0V630M900 0V630M1000 0V630M1100 0V630"/>
  </g>

  <!-- brand -->
  <g transform="translate(80, 74)">
    <rect width="56" height="56" rx="15" fill="url(#mark)"/>
    <g stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M28 40V16"/>
      <path d="M18 26l10-10 10 10"/>
    </g>
    <text x="76" y="27" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#e8ecf1">RN Safe Upgrade</text>
    <text x="76" y="50" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#8b95a4">React Native upgrade assistant</text>
  </g>

  <!-- headline -->
  <text x="80" y="262" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">The upgrade</text>
  <text x="80" y="334" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#ffffff">assistant for</text>
  <text x="80" y="406" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="62" font-weight="700" fill="#5b8def">React Native</text>

  <text x="80" y="458" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#98a2b3">An auto-generated brief, dependency checks and the</text>
  <text x="80" y="488" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#98a2b3">template diff, plus a local agent bridge that</text>
  <text x="80" y="518" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="21" fill="#98a2b3">performs the upgrade for you.</text>

  <!-- feature row -->
  <g transform="translate(80, 552)" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17">
    <g>
      <rect width="228" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="24" cy="22" r="5" fill="#4ecfa1"/>
      <text x="42" y="28" fill="#c3cbd6">Always up to date</text>
    </g>
    <g transform="translate(248, 0)">
      <rect width="228" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="24" cy="22" r="5" fill="#5b8def"/>
      <text x="42" y="28" fill="#c3cbd6">Dependency checks</text>
    </g>
    <g transform="translate(496, 0)">
      <rect width="228" height="44" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#ffffff" stroke-opacity="0.09"/>
      <circle cx="24" cy="22" r="5" fill="#e5b25d"/>
      <text x="42" y="28" fill="#c3cbd6">Agent bridge</text>
    </g>
  </g>

  <!-- version pill -->
  <g transform="translate(790, 214)">
    <rect width="360" height="130" rx="16" fill="#12151b" stroke="#242a33"/>
    <text x="26" y="38" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.4" fill="#6b7686">UPGRADE</text>
    <g font-family="Menlo, Monaco, monospace" font-size="30">
      <text x="26" y="80" fill="#e8ecf1">0.76.5</text>
      <text x="140" y="80" fill="#5b8def">&#8594;</text>
      <text x="186" y="80" fill="#e8ecf1">0.88.0</text>
    </g>
    <text x="26" y="108" font-family="Menlo, Monaco, monospace" font-size="15" fill="#8b95a4">react ^19.3.0</text>
  </g>

  <text x="1120" y="600" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="16" fill="#6b7686">heymeowcat.is-a.dev/rn-safe-upgrade</text>
</svg>
